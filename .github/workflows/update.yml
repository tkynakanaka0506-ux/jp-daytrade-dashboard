name: Update JP Daytrade Dashboard

on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 JST -> morning
    - cron: '0 12 * * *'   # 21:00 JST -> evening
    - cron: '0 0 * * 1-5'  # 09:00 JST -> intraday (weekdays only)
    - cron: '0 3 * * 1-5'  # 12:00 JST -> midday (weekdays only)
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning or evening'
        required: false
        default: 'morning'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then
            echo "mode=evening" >> "$GITHUB_OUTPUT"
          else
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Java
        run: mvn -q -B package

      - name: Update data.json (Java)
        run: java -jar target/dashboard-updater.jar "${{ steps.mode.outputs.mode }}" data.json

      - name: Render HTML (Python)
        run: python3 render_dashboard.py data.json index.html

      - name: Commit and push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update (${{ steps.mode.outputs.mode }}) $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
