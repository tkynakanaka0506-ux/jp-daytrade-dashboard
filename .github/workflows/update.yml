name: Update JP Daytrade Dashboard

on:
  schedule:
    - cron: '0 21 * * *'→ Runs at 21:00   # 06:00 JST = 21:00 UTC(前日) → 朝の更新
    - cron: '0 12 * * *'→ Runs at 12:00   # 21:00 JST = 12:00 UTC → 夜(引け後)の更新
    - cron: '0 0 * * 1-5'   # 09:00 JST = 00:00 UTC - intraday (weekdays)
    - cron: '0 3 * * 1-5'   # 12:00 JST = 03:00 UTC - midday (weekdays)
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード(morning または evening)'
        required: false
        default: 'morning'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 実行モードを判定
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then
            echo "mode=evening" >> "$GITHUB_OUTPUT"
          else
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Java 21 セットアップ
        uses: actions/setup-java@v4
        with:
