name: Update JP Daytrade Dashboard

on:
  schedule:
    # 日本市場時間帯(8:30〜15:30 JST)は15分おき(morning扱い)
    # 8:30 JST = 23:30 UTC(前日)、15:30 JST = 06:30 UTC
    - cron: '30,45 23 * * *'   # 23:30, 23:45 UTC = 8:30, 8:45 JST
    - cron: '*/15 0-5 * * *'   # 0:00〜5:45 UTC = 9:00〜14:45 JST(15分おき)
    - cron: '0,15,30 6 * * *'  # 6:00, 6:15, 6:30 UTC = 15:00, 15:15, 15:30 JST
    # それ以外の時間帯は2時間おき(evening扱い)
    - cron: '0 7,9,11,13,15,17,19,21,23 * * *'  # 16,18,20,22,0,2,4,6,8時 JST
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード(morning または evening)'
        required: false
        default: 'morning'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 実行モードを判定
        id: mode
        run: |
          SCHED="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$SCHED" = "30,45 23 * * *" ] || [ "$SCHED" = "*/15 0-5 * * *" ] || [ "$SCHED" = "0,15,30 6 * * *" ]; then
            # 日本市場時間帯(8:30〜15:30 JST)の15分おき実行 → morning扱い
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          else
            # それ以外の2時間おき実行 → evening扱い
            echo "mode=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: Java 21 セットアップ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Python セットアップ(HTML生成用・ネットワーク不要)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Javaプログラムをビルド
        run: mvn -q -B package

      - name: データ取得・data.json更新(Java・決定論的な部分)
        env:
          # EDINET APIはVersion 2から利用登録(無料)+APIキーが必須。未設定でも他の処理は継続する
          # (大量保有報告書チェックのみスキップされる)。
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: java -jar target/dashboard-updater.jar "${{ steps.mode.outputs.mode }}" data.json

      - name: ニュース分析・話題株選定(Python + Gemini無料枠・任意)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 news_analyzer.py "${{ steps.mode.outputs.mode }}" data.json

      - name: HTML再生成(既存のPure Pythonレンダラー)
        run: python3 render_dashboard.py data.json index.html

      - name: 最注力銘柄をLINEへ通知(任意・条件を満たす銘柄がある場合のみ)
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 notify_line.py data.json

      - name: 差分があればcommit & push
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          # 一時的なブランチを作って最新の成果物をコミットし、mainに強制上書きする
          git checkout -b temp-branch
          git add data.json index.html

          if ! git diff --cached --quiet; then
            git commit -m "Auto update"
            # リモートのmainブランチを、今の内容で強制的に置き換える
            git push origin temp-branch:main --force
          else
            echo "No changes to commit."
          fi
